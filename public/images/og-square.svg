<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <rect width="600" height="600" fill="#efeae0" />
  <rect x="20" y="20" width="560" height="560" fill="#f6f2e8" stroke="#7c2d26" stroke-width="3" rx="8" />
  <rect x="32" y="32" width="536" height="536" fill="none" stroke="rgba(28, 36, 25, 0.2)" stroke-width="1.5" stroke-dasharray="6 4" rx="4" />

  <!-- Monogram -->
  <g transform="translate(300, 180)">
    <circle cx="0" cy="0" r="70" fill="#efeae0" stroke="#7c2d26" stroke-width="4" />
    <text x="0" y="22" font-family="'DejaVu Serif', Georgia, serif" font-size="54" font-weight="bold" fill="#7c2d26" text-anchor="middle">YQ</text>
  </g>

  <!-- Title -->
  <text x="300" y="320" font-family="'DejaVu Serif', Georgia, serif" font-size="44" font-weight="bold" fill="#1c2419" text-anchor="middle">
